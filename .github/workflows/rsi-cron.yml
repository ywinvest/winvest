name: Run RSI Script

on:
  workflow_dispatch:
  schedule:
  # 매주 월~금 오전 8:20, 11:40, 오후 3:00 (UTC 기준 시간), 대기열로 인해 발생하는 지연시간을 가정함
  - cron: "20 23 * * 0-4" # 오전 8:20 (UTC+9)
  - cron: "40 2 * * 1-5"   # 정오 11:40 (UTC+9)
  - cron: "0 6 * * 1-5"  # 오후 3:00 (UTC+9)

jobs:
  run-rsi:
    runs-on: ubuntu-latest

    steps:
    # Python 설치
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    # 레포지토리 클론
    - name: Checkout repository
      uses: actions/checkout@v3

    # 의존성 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Python 스크립트 실행
    - name: Run RSI script (Global Market)
      if: ${{ github.event.schedule == '20 23 * * 0-4' }}
      run: |
        python rsi.py --market global

    - name: Run RSI script (Korea Market - 11:40)
      if: ${{ github.event.schedule == '40 2 * * 1-5' }}
      run: |
        python rsi.py --market korea

    - name: Run RSI script (Korea Market - 15:00)
      if: ${{ github.event.schedule == '0 6 * * 1-5' }}
      run: |
        python rsi.py --market korea
