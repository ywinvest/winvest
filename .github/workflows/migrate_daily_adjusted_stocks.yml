name: Reload Tinybird - KRX Daily Adjusted Stocks

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Start date to load (YYYY-MM-DD)'
        required: false
        default: '2015-06-15'
        type: string

jobs:
  run-load-adjusted-stocks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scripts.txt

      - name: Reload Tinybird KRX Daily Adjusted Stocks
        env:
          TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
          TINYBIRD_API_URL: ${{ vars.TINYBIRD_API_URL }}
        run: |
          CMD="python scripts/reload_tinybird_krx_daily_adjusted_stocks.py --start ${{ github.event.inputs.start }}"
          echo "Running: $CMD"
          $CMD
