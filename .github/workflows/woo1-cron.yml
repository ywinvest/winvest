name: Run woo1 strategy

on:
  workflow_dispatch:
  schedule:
  # 매주 월~금 오후 3:10 (UTC 기준 시간), 대기열로 인해 발생하는 지연시간을 고려함
  - cron: "10 6 * * 1-5"  # 오후 3:10 (UTC+9)

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
    # Python 설치
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    # 레포지토리 클론
    - name: Checkout repository
      uses: actions/checkout@v3

    # 의존성 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run python script
      run: |
        python woo1.py
