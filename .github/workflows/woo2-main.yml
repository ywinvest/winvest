name: woo2 - Send signal

on:
  workflow_dispatch:
  schedule:
  # 매주 월~금, 대기열로 인해 발생하는 지연시간을 고려함
  - cron: "55 5 * * 1-5"  # 오후 2:55 (UTC+9)
  - cron: "10 6 * * 1-5"  # 오후 3:10 (UTC+9)

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
    # 레포지토리 클론
    - name: Checkout repository
      uses: actions/checkout@v3

    # Python 설치
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
        cache: "pip"
        cache-dependency-path: "requirements.txt"

    # - name: Cache pip dependencies
    #   uses: actions/cache@v4
    #   with:
    #     path: ~/.cache/pip
    #     key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pip-

    # 의존성 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set SLACK_CHANNEL based on branch
      id: set-channel
      run: |
        if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
          echo "SLACK_CHANNEL=woo2" >> $GITHUB_ENV
        else
          echo "SLACK_CHANNEL=woo2-dev" >> $GITHUB_ENV
        fi

    - name: Run python script
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL: ${{ env.SLACK_CHANNEL }}
      run: |
        python woo2.py
