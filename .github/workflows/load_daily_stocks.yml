name: Initial Load - KRX Daily Stocks (Raw)

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year to load (e.g., 2015)'
        required: false
        default: '2015'
        type: string
      end_year:
        description: 'End year to load (e.g., 2026). Leave empty for current year.'
        required: false
        type: string

jobs:
  run-load-stocks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scripts.txt

      - name: Run Load KRX Daily Stocks
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          CMD="python scripts/load_krx_daily_stocks.py --start-year ${{ github.event.inputs.start_year }}"
          if [ -n "${{ github.event.inputs.end_year }}" ]; then
            CMD="$CMD --end-year ${{ github.event.inputs.end_year }}"
          fi
          echo "Running: $CMD"
          $CMD
