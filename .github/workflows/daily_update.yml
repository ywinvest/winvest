name: Daily Stock Ingestion & RS Calculation

on:
  schedule:
    # Runs at 08:00 UTC (17:00 KST / 5:00 PM KST) every day from Mon to Fri
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYYMMDD or YYYY-MM-DD). Leave empty for latest trading date.'
        required: false
        type: string

jobs:
  run-daily-scripts:
    runs-on: ubuntu-latest
    env:
      TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
      TINYBIRD_API_URL: ${{ vars.TINYBIRD_API_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scripts.txt

      - name: Set Target Date Option
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "DATE_OPT=--date ${{ github.event.inputs.date }}" >> $GITHUB_ENV
          else
            echo "DATE_OPT=" >> $GITHUB_ENV
          fi

      - name: 1. Ingest Market Indices (ingest_daily_krx_indices.py)
        run: |
          python scripts/ingest_daily_krx_indices.py $DATE_OPT

      - name: 2. Ingest KRX Stock Listing (ingest_daily_krx_stocks.py)
        run: |
          python scripts/ingest_daily_krx_stocks.py $DATE_OPT

      - name: 3. Ingest Adjusted Stocks & Compute RS (ingest_daily_krx_adjusted_stocks.py)
        run: |
          python scripts/ingest_daily_krx_adjusted_stocks.py $DATE_OPT

      - name: 4. Backfill Discrepant Adjusted Stocks (backfill_krx_adjusted_stocks.py)
        run: |
          python scripts/backfill_krx_adjusted_stocks.py $DATE_OPT
