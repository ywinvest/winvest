name: Daily Stock Update & RS Calculation

on:
  schedule:
    # Runs at 08:00 UTC (17:00 KST / 5:00 PM KST) every day from Mon to Fri
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYYMMDD) for RS calculation. Leave empty for today.'
        required: false
        type: string

jobs:
  run-daily-scripts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scripts.txt

      - name: 1. Run Daily Stock Update (update_krx_daily_stocks.py)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          else
            TODAY="${{ github.event.inputs.date }}"
          fi
          python scripts/update_krx_daily_stocks.py --date $TODAY
        
      - name: 2. Run RS Calculation (calculate_krx_daily_stock_indicators.py)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          else
            TODAY="${{ github.event.inputs.date }}"
          fi
          python scripts/calculate_krx_daily_stock_indicators.py --date $TODAY
