<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}stockspace{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Theme Manager (FOUC Prevention) -->
    <script>
        try {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (_) {}
    </script>
    <!-- Tailwind CSS (CDN for testing, replace with CLI later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        theme: {
                            bg: 'var(--color-bg)',
                            surface: 'var(--color-surface)',
                            border: 'var(--color-border)',
                            text: 'var(--color-text)',
                            muted: 'var(--color-muted)'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        :root {
            color-scheme: light;
            --color-bg: #F9FAFB;
            --color-surface: #FFFFFF;
            --color-border: #E5E7EB;
            --color-text: #111827;
            --color-muted: #6B7280;
        }
        :root.dark {
            color-scheme: dark;
            --color-bg: #0A0A0A;
            --color-surface: #141414;
            --color-border: #2A2A2A;
            --color-text: #E0E0E0;
            --color-muted: #9CA3AF;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
        }
        
        .table-container {
            max-height: 80vh;
            overflow-y: auto;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-surface); 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }
        
        /* 테이블 헤더 고정 */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--color-surface);
            box-shadow: 0 1px 0 0 var(--color-border);
        }
        
        /* 긍정/부정 색상 (한국 증시: 상승=Red, 하락=Blue) */
        .text-positive { color: #EF4444; }
        .text-negative { color: #3B82F6; }
        
        /* 부드러운 전환 효과 */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading indicator fix for empty space */
        .htmx-indicator {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator,
        .htmx-indicator.initial-loading {
            opacity: 1;
            pointer-events: auto;
            transition: none;
        }
    </style>
    <link rel="icon" type="image/png" href="/static/stockspace_logo_transparent.png">
</head>
<body class="bg-theme-bg text-theme-text min-h-screen pb-20 md:pb-0 relative">
    <!-- Navbar -->
    <nav class="border-b border-theme-border bg-theme-surface sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Left side: Logo & Navigation -->
                <div class="flex items-center">
                    <!-- Logo -->
                    <div class="flex items-center space-x-1.5">
                        <img src="/static/stockspace_logo_transparent.png" alt="Stockspace Logo" class="h-8 w-8 drop-shadow-[0_0_12px_rgba(34,211,238,0.4)] transform transition-transform hover:scale-105">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl font-extrabold tracking-tight leading-none bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-500 to-cyan-400" style="padding-bottom: 2px;">stockspace</span>
                            <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider leading-none text-cyan-300 bg-cyan-900/30 border border-cyan-500/30 rounded-full shadow-[0_0_10px_rgba(34,211,238,0.2)]">beta</span>
                        </div>
                    </div>
                    
                    <!-- Desktop Menu -->
                    <div class="hidden md:block ml-10">
                        <div class="flex items-baseline space-x-4">
                            <!-- Navigation Menus -->
                            <a href="/market" class="px-3 py-2 rounded-md text-sm font-semibold transition-colors duration-200 shadow-sm border border-theme-border {% if '/market' in request.url.path %}text-cyan-400 bg-theme-bg{% else %}text-theme-muted hover:text-theme-text hover:bg-theme-bg/50{% endif %}">시장</a>
                            <a href="/rs" class="px-3 py-2 rounded-md text-sm font-semibold transition-colors duration-200 shadow-sm border border-theme-border {% if '/rs' in request.url.path %}text-cyan-400 bg-theme-bg{% else %}text-theme-muted hover:text-theme-text hover:bg-theme-bg/50{% endif %}">종목</a>
                        </div>
                    </div>
                </div>
                
                <!-- Right side: Actions -->
                <div class="flex items-center space-x-4">
                    <!-- Theme Toggle Dropdown -->
                    <div class="relative" x-data="{ 
                        open: false,
                        theme: localStorage.theme || 'system',
                        setTheme(val) {
                            this.theme = val;
                            if (val === 'system') {
                                localStorage.removeItem('theme');
                                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                                    document.documentElement.classList.add('dark');
                                } else {
                                    document.documentElement.classList.remove('dark');
                                }
                            } else {
                                localStorage.theme = val;
                                if (val === 'dark') {
                                    document.documentElement.classList.add('dark');
                                } else {
                                    document.documentElement.classList.remove('dark');
                                }
                            }
                            this.open = false;
                        }
                    }">
                        <button @click="open = !open" @click.away="open = false" class="text-theme-muted hover:text-theme-text transition-colors p-2 rounded-full hover:bg-theme-border/50 focus:outline-none">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div x-show="open" x-cloak
                             x-transition:enter="transition ease-out duration-100"
                             x-transition:enter-start="transform opacity-0 scale-95"
                             x-transition:enter-end="transform opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-75"
                             x-transition:leave-start="transform opacity-100 scale-100"
                             x-transition:leave-end="transform opacity-0 scale-95"
                             class="absolute right-0 mt-2 w-36 bg-theme-surface border border-theme-border rounded-lg shadow-xl z-50 overflow-hidden"
                             style="display: none;">
                            <div class="py-1">
                                <button @click="setTheme('light')" class="flex items-center w-full px-4 py-2 text-sm text-theme-text hover:bg-theme-bg/80 transition-colors" :class="{ 'text-indigo-500 font-semibold bg-theme-bg': theme === 'light' }">
                                    <svg class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                    Light
                                </button>
                                <button @click="setTheme('dark')" class="flex items-center w-full px-4 py-2 text-sm text-theme-text hover:bg-theme-bg/80 transition-colors" :class="{ 'text-indigo-500 font-semibold bg-theme-bg': theme === 'dark' }">
                                    <svg class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                                    Dark
                                </button>
                                <button @click="setTheme('system')" class="flex items-center w-full px-4 py-2 text-sm text-theme-text hover:bg-theme-bg/80 transition-colors" :class="{ 'text-indigo-500 font-semibold bg-theme-bg': theme === 'system' }">
                                    <svg class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                                    System
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

{% block content %}{% endblock %}

    <!-- Mobile Bottom Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-theme-surface/80 backdrop-blur-xl border-t border-theme-border" style="padding-bottom: env(safe-area-inset-bottom);">
        <div class="flex justify-around items-center h-16 px-2">
            <!-- Market Tab -->
            <a href="/market" class="flex flex-col items-center justify-center w-full h-full gap-1 transition-colors duration-200 {% if '/market' in request.url.path %}text-cyan-500 font-bold{% else %}text-theme-muted hover:text-theme-text{% endif %}">
                <svg class="w-6 h-6 {% if '/market' in request.url.path %}drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]{% endif %}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
                <span class="text-[10px]">시장</span>
            </a>
            
            <!-- RS Stocks Tab -->
            <a href="/rs" class="flex flex-col items-center justify-center w-full h-full gap-1 transition-colors duration-200 {% if '/rs' in request.url.path %}text-cyan-500 font-bold{% else %}text-theme-muted hover:text-theme-text{% endif %}">
                <svg class="w-6 h-6 {% if '/rs' in request.url.path %}drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]{% endif %}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                </svg>
                <span class="text-[10px]">종목</span>
            </a>
        </div>
    </div>
</body>
</html>
