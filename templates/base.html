<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}stockspace{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Theme Manager (FOUC Prevention) -->
    <script>
        try {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch (_) {}
    </script>
    <!-- DaisyUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Plus Jakarta Sans", sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, monospace;
        }
    </style>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .table-container {
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Loading indicator fix for empty space */
        .htmx-indicator {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator,
        .htmx-indicator.initial-loading {
            opacity: 1;
            pointer-events: auto;
            transition: none;
        }
    </style>
    <link rel="icon" type="image/png" href="/static/stockspace_logo_transparent.png">
</head>
<body class="bg-base-200 text-base-content min-h-screen pb-20 md:pb-0 relative">
    <!-- Navbar -->
    <div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
        <div class="navbar-start">
            <a href="/" class="btn btn-ghost text-xl gap-2">
                <img src="/static/stockspace_logo_transparent.png" alt="Stockspace Logo" class="h-8 w-8 drop-shadow-md transform transition-transform hover:scale-105">
                <span class="font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-500 to-cyan-400">stockspace</span>
                <span class="badge badge-sm badge-info badge-outline font-bold">beta</span>
            </a>
            <div class="hidden md:flex ml-2">
                <ul class="menu menu-horizontal px-1 font-semibold">
                    <li><a href="/market" class="{% if '/market' in request.url.path %}active{% endif %}">시장</a></li>
                    <li><a href="/rs" class="{% if '/rs' in request.url.path %}active{% endif %}">종목</a></li>
                </ul>
            </div>
        </div>
        <div class="navbar-center hidden md:flex">
        </div>
        <div class="navbar-end">
            <div class="dropdown dropdown-end" x-data="{ 
                theme: localStorage.theme || 'system',
                setTheme(val) {
                    this.theme = val;
                    if (val === 'system') {
                        localStorage.removeItem('theme');
                        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                            document.documentElement.setAttribute('data-theme', 'dark');
                        } else {
                            document.documentElement.setAttribute('data-theme', 'light');
                        }
                    } else {
                        localStorage.theme = val;
                        document.documentElement.setAttribute('data-theme', val);
                    }
                }
            }">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-100 rounded-box w-36">
                    <li><a @click="setTheme('light')" :class="{ 'active': theme === 'light' }">Light</a></li>
                    <li><a @click="setTheme('dark')" :class="{ 'active': theme === 'dark' }">Dark</a></li>
                    <li><a @click="setTheme('system')" :class="{ 'active': theme === 'system' }">System</a></li>
                </ul>
            </div>
        </div>
    </div>

{% block content %}{% endblock %}

    <!-- Mobile Bottom Navigation Bar -->
    <div class="dock md:hidden z-50 bg-base-100/80 backdrop-blur-xl border-t border-base-200" style="padding-bottom: env(safe-area-inset-bottom);">
        <a href="/market" class="{% if '/market' in request.url.path %}dock-active text-info{% endif %}">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
            <span class="dock-label text-[10px]">시장</span>
        </a>
        <a href="/rs" class="{% if '/rs' in request.url.path %}dock-active text-info{% endif %}">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            <span class="dock-label text-[10px]">종목</span>
        </a>
    </div>
</body>
</html>
