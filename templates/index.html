<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상대강도 (RS)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Tailwind CSS (CDN for testing, replace with CLI later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Config for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        dark: {
                            bg: '#0A0A0A',
                            surface: '#141414',
                            border: '#2A2A2A'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0A0A0A;
            color: #E0E0E0;
        }
        
        .table-container {
            max-height: 80vh;
            overflow-y: auto;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414; 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }
        
        /* 테이블 헤더 고정 */
        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #141414;
            box-shadow: 0 1px 0 0 #2A2A2A;
        }
        
        /* 긍정/부정 색상 (한국 증시: 상승=Red, 하락=Blue) */
        .text-positive { color: #EF4444; }
        .text-negative { color: #3B82F6; }
        
        /* 부드러운 전환 효과 */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Loading indicator fix for empty space */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request.htmx-indicator {
            display: block;
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-200 min-h-screen">
    <!-- Navbar -->
    <nav class="border-b border-dark-border bg-dark-surface sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Left side: Logo & Navigation -->
                <div class="flex items-center">
                    <!-- Logo -->
                    <div class="flex items-center space-x-3">
                        <svg class="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-500 to-cyan-400">stocktide</span>
                            <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-cyan-300 bg-cyan-900/30 border border-cyan-500/30 rounded-full relative top-0.5 shadow-[0_0_10px_rgba(34,211,238,0.2)]">beta</span>
                        </div>
                    </div>
                    
                    <!-- Desktop Menu -->
                    <div class="hidden md:block ml-10">
                        <div class="flex items-baseline space-x-4">
                            <!-- Active Menu -->
                            <a href="/" class="text-cyan-400 bg-dark-bg px-3 py-2 rounded-md text-sm font-semibold shadow-sm border border-dark-border">상대강도 (RS)</a>
                        </div>
                    </div>
                </div>
                
                <!-- Right side: Actions -->
                <div class="flex items-center space-x-4">
                    <!-- User Profile / Settings placeholder -->
                    <button class="text-gray-400 hover:text-white transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-end items-center mb-6">
            <div class="flex flex-wrap items-center gap-3">
                <!-- Date Filter (HTMX) -->
                <div class="relative group">
                    <input type="date" name="date" hx-get="/api/rs-table" hx-target="#rs-table-container" hx-indicator="#loading" class="bg-dark-surface border border-dark-border text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 text-white outline-none">
                </div>

                <!-- Market Filter (Client-side) -->
                <div class="relative group">
                    <select id="marketFilter" class="bg-dark-surface border border-dark-border text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 text-white outline-none appearance-none pr-8">
                        <option value="">전체 시장</option>
                        <option value="KOSPI">KOSPI</option>
                        <option value="KOSDAQ">KOSDAQ</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
                
                <!-- Marcap Filter (Client-side) -->
                <div class="relative group">
                    <select id="marcapFilter" class="bg-dark-surface border border-dark-border text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 text-white outline-none appearance-none pr-8">
                        <option value="">시가총액 전체</option>
                        <option value="2000">2천억 이상</option>
                        <option value="5000">5천억 이상</option>
                        <option value="10000">1조 이상</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <!-- Search Input (Client-side) -->
                <div class="relative group">
                    <input type="text" 
                           id="searchInput"
                           placeholder="종목명/코드 검색..." 
                           class="bg-dark-surface border border-dark-border text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 focus:shadow-[0_0_15px_rgba(99,102,241,0.3)] block w-64 p-2.5 text-white transition-all duration-300 outline-none">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Table Container (HTMX Target) -->
        <div class="bg-dark-surface border border-dark-border rounded-xl shadow-2xl overflow-hidden fade-in">
            <!-- Loading Indicator -->
            <div id="loading" class="htmx-indicator p-16 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
                <p class="text-gray-400 font-medium">stocktide 모멘텀 데이터를 불러오는 중...</p>
            </div>
            
            <div class="table-container" id="rs-table-container" hx-get="/api/rs-table" hx-trigger="load">
                <!-- 테이블이 여기에 렌더링됩니다 -->
            </div>
        </div>
    </main>


    <!-- Client-side filtering and sorting script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const marketFilter = document.getElementById('marketFilter');
            const marcapFilter = document.getElementById('marcapFilter');
            const dateInput = document.querySelector('input[type="date"][name="date"]');
            
            // Set default date to today in local browser timezone
            if (dateInput && !dateInput.value) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
            }
            
            let currentSortCol = 'rs';
            let currentSortOrder = 'desc';

            function applyFiltersAndSort() {
                const tbody = document.getElementById('rs-table-body');
                if (!tbody) return;
                
                const rows = Array.from(tbody.querySelectorAll('tr.stock-row'));
                if (rows.length === 0) return;

                const search = searchInput.value.toLowerCase();
                const market = marketFilter.value;
                const minMarcap = marcapFilter.value ? parseInt(marcapFilter.value) * 100000000 : 0;

                // Filtering
                rows.forEach(row => {
                    const rowName = row.dataset.name || "";
                    const rowCode = row.dataset.code || "";
                    const rowMarket = row.dataset.market || "";
                    const rowMarcap = parseFloat(row.dataset.marcap) || 0;

                    const matchSearch = rowName.includes(search) || rowCode.includes(search);
                    const matchMarket = market === "" || rowMarket === market;
                    const matchMarcap = minMarcap === 0 || rowMarcap >= minMarcap;

                    if (matchSearch && matchMarket && matchMarcap) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });

                // Sorting
                rows.sort((a, b) => {
                    let valA = a.dataset[currentSortCol];
                    let valB = b.dataset[currentSortCol];

                    // Convert to numbers if possible
                    if (!isNaN(parseFloat(valA)) && isFinite(valA)) {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    }

                    if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                // Re-append to DOM
                rows.forEach(row => tbody.appendChild(row));
                
                // Update icons
                updateSortIcons();
            }
            
            function updateSortIcons() {
                document.querySelectorAll('th[data-sort]').forEach(th => {
                    const icon = th.querySelector('.sort-icon');
                    if(icon) icon.innerHTML = '';
                    th.classList.remove('text-indigo-400');
                    if (th.dataset.sort === currentSortCol) {
                        th.classList.add('text-indigo-400');
                        if(icon) {
                            icon.innerHTML = currentSortOrder === 'asc' ? '▲' : '▼';
                        }
                    }
                });
            }

            // Event Listeners for Filters
            searchInput.addEventListener('input', applyFiltersAndSort);
            marketFilter.addEventListener('change', applyFiltersAndSort);
            marcapFilter.addEventListener('change', applyFiltersAndSort);

            // HTMX Load event (when table is rendered)
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if(evt.detail.target.id === 'rs-table-container') {
                    // Attach click events to new headers
                    document.querySelectorAll('th[data-sort]').forEach(th => {
                        th.addEventListener('click', () => {
                            const col = th.dataset.sort;
                            if (currentSortCol === col) {
                                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
                            } else {
                                currentSortCol = col;
                                currentSortOrder = 'desc'; // Default to desc for new columns
                            }
                            applyFiltersAndSort();
                        });
                    });
                    
                    // Reset sort to default if new data loaded
                    currentSortCol = 'rs';
                    currentSortOrder = 'desc';
                    applyFiltersAndSort();
                }
            });
        });
    </script>
</body>
</html>
