<style>
    /* 모바일 하단 드로어 (Bottom Sheet) 오버라이드 */
    @media (max-width: 767px) {
        .responsive-drawer .drawer-side {
            align-items: flex-end !important; /* 하단 배치 */
        }
        .responsive-drawer .drawer-side > *:not(.drawer-overlay) {
            transform: translateY(100%) !important; /* 아래로 숨김 */
            transition-property: transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        .responsive-drawer .drawer-toggle:checked ~ .drawer-side > *:not(.drawer-overlay) {
            transform: translateY(0) !important; /* 위로 올라옴 */
        }
    }
</style>
<!-- Drawer Side Panel -->
<div class="drawer-side z-[100]">
    <label for="stock-detail-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <!-- w-full on mobile, md:w-[450px] on desktop. Rounded corners only on mobile -->
    <div class="menu bg-base-100 text-base-content h-[85vh] md:min-h-full w-full md:w-[450px] p-0 flex flex-col rounded-t-3xl md:rounded-none shadow-2xl">
        <!-- Header -->
        <div class="sticky top-0 z-20 flex justify-between items-center p-4 border-b border-base-200 bg-base-100/90 backdrop-blur-sm">
            <div>
                <h2 class="text-xl font-bold tracking-tight" x-text="stockData.name || '-'"></h2>
                <div class="text-xs font-mono text-base-content/60" x-text="(stockData.code || '-') + ' • ' + (stockData.market || '-')"></div>
            </div>
            <button class="btn btn-sm btn-circle btn-ghost" @click="isOpen = false">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>
        
        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">
            <!-- Chart Placeholder -->
            <div class="w-full aspect-[4/3] bg-base-200 rounded-xl flex items-center justify-center border border-base-300 shadow-inner">
                <div class="text-center text-base-content/40">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
                    </svg>
                    <span class="font-semibold tracking-tight">차트 준비중</span>
                </div>
            </div>
            
            <!-- Indicators Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div class="stat p-3 bg-base-200/50 rounded-xl border border-base-200 shadow-sm">
                    <div class="stat-title text-xs font-semibold">현재가</div>
                    <div class="stat-value text-lg font-mono" :class="stockData.changes_ratio > 0 ? 'text-error' : (stockData.changes_ratio < 0 ? 'text-info' : '')" x-text="formatNumber(stockData.close)"></div>
                </div>
                <div class="stat p-3 bg-base-200/50 rounded-xl border border-base-200 shadow-sm">
                    <div class="stat-title text-xs font-semibold">등락률</div>
                    <div class="stat-value text-lg font-mono" :class="stockData.changes_ratio > 0 ? 'text-error' : (stockData.changes_ratio < 0 ? 'text-info' : '')" x-text="(stockData.changes_ratio > 0 ? '+' : '') + formatRatio(stockData.changes_ratio) + '%'"></div>
                </div>
                <!-- Combined RS Row -->
                <div class="col-span-2 p-3 bg-base-200/50 rounded-xl border border-base-200 shadow-sm flex flex-col gap-2">
                    <div class="text-xs font-semibold text-base-content/70">상대강도 (RS)</div>
                    <div class="grid grid-cols-5 gap-2">
                        <div class="flex items-center justify-center bg-base-100 rounded-lg p-1.5">
                            <div class="badge badge-sm font-extrabold shadow-sm p-3" :class="getRsBadgeClass(stockData.rs)" x-text="formatNumber(stockData.rs)"></div>
                        </div>
                        <div class="text-center bg-base-200/50 rounded-lg p-1.5">
                            <div class="text-[10px] text-base-content/60 mb-0.5">1M</div>
                            <div class="font-mono text-sm font-semibold" x-text="formatNumber(stockData.rs_1m)"></div>
                        </div>
                        <div class="text-center bg-base-200/50 rounded-lg p-1.5">
                            <div class="text-[10px] text-base-content/60 mb-0.5">3M</div>
                            <div class="font-mono text-sm font-semibold" x-text="formatNumber(stockData.rs_3m)"></div>
                        </div>
                        <div class="text-center bg-base-200/50 rounded-lg p-1.5">
                            <div class="text-[10px] text-base-content/60 mb-0.5">6M</div>
                            <div class="font-mono text-sm font-semibold" x-text="formatNumber(stockData.rs_6m)"></div>
                        </div>
                        <div class="text-center bg-base-200/50 rounded-lg p-1.5">
                            <div class="text-[10px] text-base-content/60 mb-0.5">12M</div>
                            <div class="font-mono text-sm font-semibold" x-text="formatNumber(stockData.rs_12m)"></div>
                        </div>
                    </div>
                </div>
                
                <div class="stat p-3 bg-base-200/50 rounded-xl border border-base-200 shadow-sm">
                    <div class="stat-title text-xs font-semibold">시가총액</div>
                    <div class="stat-value text-sm font-mono flex items-baseline gap-0.5">
                        <span x-text="formatCap(stockData.marcap)"></span>
                        <span class="text-xs font-sans text-base-content/60 font-medium">억</span>
                    </div>
                </div>
                <div class="stat p-3 bg-base-200/50 rounded-xl border border-base-200 shadow-sm">
                    <div class="stat-title text-xs font-semibold">거래대금</div>
                    <div class="stat-value text-sm font-mono flex items-baseline gap-0.5">
                        <span x-text="formatCap(stockData.amount)"></span>
                        <span class="text-xs font-sans text-base-content/60 font-medium">억</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
