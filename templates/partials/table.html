<input type="hidden" id="actual-rendered-date" value="{{ stocks[0].date if stocks else '' }}" hx-swap-oob="true">
<span id="stockCount" hx-swap-oob="true">{{ stocks|length }}</span>

{% if not stocks %}
<div class="py-24 flex flex-col items-center justify-center gap-3 bg-base-100 rounded-b-xl">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-base-content/20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
    </svg>
    <p class="text-base-content/50">데이터가 없습니다.</p>
</div>
{% else %}
<table class="table table-zebra table-pin-rows w-full text-sm">
    <thead class="text-xs uppercase select-none">
        <tr>
            <th scope="col" class="bg-base-100 hidden md:table-cell cursor-pointer hover:text-base-content w-16 text-primary" data-sort="rs_rank">순위 <span
                    class="sort-icon">▲</span></th>
            <th scope="col" class="bg-base-100 cursor-pointer hover:text-base-content" data-sort="name">종목명 <span
                    class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right cursor-pointer hover:text-base-content"
                data-sort="close">현재가 <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 text-right cursor-pointer hover:text-base-content"
                data-sort="changes_ratio">등락률(%) <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 text-right cursor-pointer hover:text-base-content" data-sort="rs">
                RS<span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right text-base-content/60 cursor-pointer hover:text-base-content"
                data-sort="rs_1m">RS_1M <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right text-base-content/60 cursor-pointer hover:text-base-content"
                data-sort="rs_3m">RS_3M <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right text-base-content/60 cursor-pointer hover:text-base-content"
                data-sort="rs_6m">RS_6M <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right text-base-content/60 cursor-pointer hover:text-base-content"
                data-sort="rs_12m">RS_12M <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-center cursor-pointer hover:text-base-content"
                data-sort="market">시장 <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right cursor-pointer hover:text-base-content"
                data-sort="marcap">시가총액(억) <span class="sort-icon"></span></th>
            <th scope="col" class="bg-base-100 hidden md:table-cell text-right cursor-pointer hover:text-base-content"
                data-sort="amount">거래대금(억) <span class="sort-icon"></span></th>
        </tr>
    </thead>
    <tbody id="rs-table-body">
        <!-- Rows will be injected here by client-side JS -->
    </tbody>
</table>

<template id="all-rows-template">
    {% for stock in stocks %}
    <tr class="stock-row hover transition-colors group cursor-pointer" data-rs_rank="{{ stock.rs_rank }}" data-close="{{ stock.close }}"
        data-name="{{ stock.name }}" data-code="{{ stock.code }}" data-market="{{ stock.market }}"
        data-changes_ratio="{{ stock.changes_ratio }}" data-marcap="{{ stock.marcap }}"
        data-amount="{{ stock.amount or 0 }}" data-rs="{{ stock.rs }}" data-rs_1m="{{ stock.rs_1m }}"
        data-rs_3m="{{ stock.rs_3m }}" data-rs_6m="{{ stock.rs_6m }}" data-rs_12m="{{ stock.rs_12m }}">
        <td class="hidden md:table-cell text-center">
            <span class="font-mono text-[13px] font-semibold text-base-content/60">{{ stock.rs_rank }}</span>
        </td>
        <td>
            <div class="font-bold text-base-content text-[15px] tracking-tight">{{ stock.name }}</div>
            <div class="text-xs text-base-content/60 font-mono mt-0.5">{{ stock.code }}</div>
        </td>
        <td class="hidden md:table-cell text-right">
            <div class="font-mono font-semibold 
                {% if stock.changes > 0 %} text-error
                {% elif stock.changes < 0 %} text-info
                {% else %} text-base-content/60 {% endif %}">
                {{ "{:,.0f}".format(stock.close) }}
            </div>
        </td>
        <td class="text-right">
            <div class="font-mono font-semibold 
                {% if stock.changes_ratio > 0 %} text-error
                {% elif stock.changes_ratio < 0 %} text-info
                {% else %} text-base-content/60 {% endif %}">
                {% if stock.changes > 0 %}▲{% elif stock.changes < 0 %}▼{% endif %} {% if stock.changes_ratio > 0 %}+{% endif %}{{ "%.2f"|format(stock.changes_ratio) }}%
            </div>
        </td>
        <td class="text-right">
            <div class="badge badge-sm font-extrabold shadow-sm p-3
                {% if stock.rs >= 90 %} badge-success badge-outline border-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.2)]
                {% elif stock.rs >= 70 %} badge-success badge-outline
                {% elif stock.rs <= 30 %} badge-error badge-outline
                {% else %} badge-neutral badge-outline opacity-50 {% endif %}">
                {{ "%.0f"|format(stock.rs) }}
            </div>
        </td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/60 group-hover:text-base-content">{{
            "%.0f"|format(stock.rs_1m) }}</td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/60 group-hover:text-base-content">{{
            "%.0f"|format(stock.rs_3m) }}</td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/60 group-hover:text-base-content">{{
            "%.0f"|format(stock.rs_6m) }}</td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/60 group-hover:text-base-content">{{
            "%.0f"|format(stock.rs_12m) }}</td>
        <td class="hidden md:table-cell text-center">
            {% if stock.market == "KOSPI" %}
            <span class="badge badge-sm badge-info badge-outline font-bold">KOSPI</span>
            {% else %}
            <span class="badge badge-sm badge-secondary badge-outline font-bold">KOSDAQ</span>
            {% endif %}
        </td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/80 group-hover:text-base-content">
            {{ "{:,.0f}".format(stock.marcap / 100000000) }}
        </td>
        <td class="hidden md:table-cell text-right font-mono text-base-content/80 group-hover:text-base-content">
            {% if stock.amount %}
            {{ "{:,.0f}".format(stock.amount / 100000000) }}
            {% else %}
            -
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</template>
{% endif %}
