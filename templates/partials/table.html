{% if not stocks %}
<div class="p-12 text-center text-theme-muted">
    <svg class="mx-auto h-12 w-12 text-theme-muted mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
    </svg>
    <p class="text-lg font-medium">조회된 RS 데이터가 없습니다.</p>
</div>
{% else %}
<div class="px-6 py-3 border-b border-theme-border flex justify-between items-center bg-theme-surface sticky top-0 z-20">
    <div class="text-sm text-theme-muted">
        기준일: <span id="current-rendered-date" class="font-mono text-theme-text font-medium">{{ stocks[0].date }}</span>
    </div>
    <div class="text-sm text-theme-muted">
        총 <span id="stockCount" class="font-mono text-indigo-600 dark:text-indigo-400 font-semibold">{{ stocks|length }}</span> 개 종목
    </div>
</div>
<table class="w-full text-sm text-left whitespace-nowrap">
    <thead class="text-xs text-theme-muted uppercase bg-theme-surface border-b border-theme-border select-none">
        <tr>
            <th scope="col" class="px-4 py-3 font-semibold w-16 text-center cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="rank">순위 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold cursor-pointer hover:text-gray-900 dark:hover:text-white" data-sort="name">종목명 <span
                    class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-center cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="market">시장 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="changes_ratio">현재가 / 전일비 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="marcap">시가총액(억) <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="amount">거래대금(억) <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-gray-900 dark:hover:text-white" data-sort="rs">
                RS<span class="sort-icon text-indigo-500 dark:text-indigo-400">▼</span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-theme-muted cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="rs_1m">RS_1M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-theme-muted cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="rs_3m">RS_3M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-theme-muted cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="rs_6m">RS_6M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-theme-muted cursor-pointer hover:text-gray-900 dark:hover:text-white"
                data-sort="rs_12m">RS_12M <span class="sort-icon"></span></th>
        </tr>
    </thead>
    <tbody id="rs-table-body" class="divide-y divide-theme-border">
        <!-- Rows will be injected here by client-side JS -->
    </tbody>
</table>

<template id="all-rows-template">
    {% for stock in stocks %}
    <tr class="stock-row hover:bg-gray-100 dark:hover:bg-[#1A1A1A] transition-colors group cursor-pointer" data-rank="{{ stock.rank }}"
        data-name="{{ stock.name|lower }}" data-code="{{ stock.code|lower }}" data-market="{{ stock.market }}"
        data-changes_ratio="{{ stock.changes_ratio }}" data-marcap="{{ stock.marcap }}"
        data-amount="{{ stock.amount or 0 }}" data-rs="{{ stock.rs }}" data-rs_1m="{{ stock.rs_1m }}"
        data-rs_3m="{{ stock.rs_3m }}" data-rs_6m="{{ stock.rs_6m }}" data-rs_12m="{{ stock.rs_12m }}">
        <td
            class="px-4 py-3 text-center font-mono text-gray-500 dark:text-gray-400 font-semibold group-hover:text-gray-900 dark:group-hover:text-white transition-colors">
            {{ stock.rank }}
        </td>
        <td class="px-4 py-3">
            <div class="font-bold text-gray-900 dark:text-gray-200 text-[15px] tracking-tight">{{ stock.name }}</div>
            <div class="text-xs text-theme-muted font-mono">{{ stock.code }}</div>
        </td>
        <td class="px-4 py-3 text-center">
            {% if stock.market == "KOSPI" %}
            <span
                class="px-2 py-0.5 text-[10px] uppercase tracking-wider font-bold bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-400 rounded-md border border-indigo-200 dark:border-indigo-800/50">KOSPI</span>
            {% else %}
            <span
                class="px-2 py-0.5 text-[10px] uppercase tracking-wider font-bold bg-fuchsia-100 text-fuchsia-700 dark:bg-fuchsia-900/30 dark:text-fuchsia-400 rounded-md border border-fuchsia-200 dark:border-fuchsia-800/50">KOSDAQ</span>
            {% endif %}
        </td>
        <td class="px-4 py-3 text-right">
            <!-- 아직 close(현재가) 컬럼이 라우터에서 안넘어오면 빈값처리됨, 우선 changes만 표현 -->
            <div class="font-mono font-semibold 
                {% if stock.changes > 0 %} text-positive
                {% elif stock.changes < 0 %} text-negative
                {% else %} text-theme-muted {% endif %}">
                {% if stock.changes > 0 %}▲{% elif stock.changes < 0 %}▼{% endif %} {{ "{:,.0f}"
                    .format(stock.changes|abs) }} </div>
                    <div class="text-xs font-mono
                {% if stock.changes_ratio > 0 %} text-positive
                {% elif stock.changes_ratio < 0 %} text-negative
                {% else %} text-theme-muted {% endif %}">
                        {% if stock.changes_ratio > 0 %}+{% endif %}{{ "%.2f"|format(stock.changes_ratio) }}%
                    </div>
        </td>
        <td class="px-4 py-3 text-right font-mono text-gray-700 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-gray-100">
            {{ "{:,.0f}".format(stock.marcap / 100000000) }}
        </td>
        <td class="px-4 py-3 text-right font-mono text-gray-700 dark:text-gray-300 group-hover:text-gray-900 dark:group-hover:text-gray-100">
            {% if stock.amount %}
            {{ "{:,.0f}".format(stock.amount / 100000000) }}
            {% else %}
            -
            {% endif %}
        </td>
        <td class="px-4 py-3 text-right">
            <div class="inline-flex items-center px-3 py-1 rounded-md font-extrabold shadow-sm
                {% if stock.rs >= 90 %} bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/50 shadow-[0_0_10px_rgba(16,185,129,0.2)]
                {% elif stock.rs >= 70 %} bg-emerald-100 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-500 border border-emerald-300 dark:border-emerald-900/50
                {% elif stock.rs <= 30 %} bg-red-100 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-300 dark:border-red-900/50
                {% else %} text-gray-600 bg-gray-100 border border-gray-200 dark:text-gray-400 dark:bg-gray-800/50 dark:border-gray-700/50 {% endif %}">
                {{ "%.0f"|format(stock.rs) }}
            </div>
        </td>
        <td class="px-3 py-3 text-right font-mono text-theme-muted group-hover:text-gray-900 dark:group-hover:text-gray-300">{{
            "%.0f"|format(stock.rs_1m) }}</td>
        <td class="px-3 py-3 text-right font-mono text-theme-muted group-hover:text-gray-900 dark:group-hover:text-gray-300">{{
            "%.0f"|format(stock.rs_3m) }}</td>
        <td class="px-3 py-3 text-right font-mono text-theme-muted group-hover:text-gray-900 dark:group-hover:text-gray-300">{{
            "%.0f"|format(stock.rs_6m) }}</td>
        <td class="px-3 py-3 text-right font-mono text-theme-muted group-hover:text-gray-900 dark:group-hover:text-gray-300">{{
            "%.0f"|format(stock.rs_12m) }}</td>
    </tr>
    {% endfor %}
</template>
{% endif %}
