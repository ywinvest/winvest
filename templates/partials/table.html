{% if not stocks %}
<div class="p-12 text-center text-gray-400">
    <svg class="mx-auto h-12 w-12 text-gray-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
    </svg>
    <p class="text-lg font-medium">조회된 RS 데이터가 없습니다.</p>
</div>
{% else %}
<div class="px-6 py-3 border-b border-dark-border flex justify-between items-center bg-dark-surface">
    <div class="text-sm text-gray-400">
        기준일: <span id="current-rendered-date" class="font-mono text-gray-200">{{ stocks[0].date }}</span>
    </div>
    <div class="text-sm text-gray-400">
        총 <span class="font-mono text-indigo-400 font-semibold">{{ stocks|length }}</span> 개 종목
    </div>
</div>
<table class="w-full text-sm text-left whitespace-nowrap">
    <thead class="text-xs text-gray-400 uppercase bg-dark-surface border-b border-dark-border select-none">
        <tr>
            <th scope="col" class="px-4 py-3 font-semibold w-16 text-center cursor-pointer hover:text-white"
                data-sort="rank">순위 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold cursor-pointer hover:text-white" data-sort="name">종목명 <span
                    class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-center cursor-pointer hover:text-white"
                data-sort="market">시장 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-white"
                data-sort="changes_ratio">현재가 / 전일비 <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-white"
                data-sort="marcap">시가총액(억) <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-white"
                data-sort="amount">거래대금(억) <span class="sort-icon"></span></th>
            <th scope="col" class="px-4 py-3 font-semibold text-right cursor-pointer hover:text-white" data-sort="rs">
                RS<span class="sort-icon text-indigo-400">▼</span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-gray-500 cursor-pointer hover:text-white"
                data-sort="rs_1m">RS_1M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-gray-500 cursor-pointer hover:text-white"
                data-sort="rs_3m">RS_3M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-gray-500 cursor-pointer hover:text-white"
                data-sort="rs_6m">RS_6M <span class="sort-icon"></span></th>
            <th scope="col" class="px-3 py-3 font-semibold text-right text-gray-500 cursor-pointer hover:text-white"
                data-sort="rs_12m">RS_12M <span class="sort-icon"></span></th>
        </tr>
    </thead>
    <tbody id="rs-table-body" class="divide-y divide-dark-border">
        {% include "partials/rows.html" %}
    </tbody>
</table>
{% endif %}
