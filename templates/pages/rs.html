{% extends "base.html" %}
{% block title %}종목 (RS) - stockspace{% endblock %}
{% block content %}
    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-end items-center mb-6">
            <div class="flex flex-col sm:flex-row flex-wrap items-stretch sm:items-center gap-3 w-full sm:w-auto">
                <!-- Date Filter (HTMX) -->
                <input type="date" name="date" hx-get="/api/rs-table" hx-target="#rs-table-container" hx-indicator="#loading" class="input w-full sm:w-auto">

                <!-- Market Filter (Client-side) -->
                <select id="marketFilter" class="select w-full sm:w-auto">
                    <option value="">전체 시장</option>
                    <option value="KOSPI">KOSPI</option>
                    <option value="KOSDAQ">KOSDAQ</option>
                </select>
                
                <!-- Marcap Filter (Client-side) -->
                <select id="marcapFilter" class="select w-full sm:w-auto">
                    <option value="">시가총액 전체</option>
                    <option value="2000" selected>2천억 이상</option>
                    <option value="5000">5천억 이상</option>
                    <option value="10000">1조 이상</option>
                </select>

                <!-- Search Input (Client-side) -->
                <label class="input w-full sm:w-64">
                    <input type="text" id="searchInput" placeholder="종목명/코드 검색..." class="grow">
                    <svg class="w-4 h-4 opacity-50" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                    </svg>
                </label>
            </div>
        </div>

        <!-- Data Table Container (HTMX Target) -->
        <div class="card glass rounded-xl shadow-2xl overflow-hidden fade-in relative min-h-[300px]">
            <!-- Loading Indicator -->
            <div id="loading" x-data @htmx:after-settle.window="$el.classList.remove('initial-loading')" class="htmx-indicator initial-loading absolute inset-0 z-50 flex flex-col items-center justify-center bg-base-100/80 backdrop-blur-sm">
                <span class="loading loading-spinner loading-lg text-primary"></span>
            </div>
            
            <div class="table-container" id="rs-table-container" hx-get="/api/rs-table{{ '?date=' + date if date else '' }}" hx-trigger="load" hx-indicator="#loading">
                <!-- 테이블이 여기에 렌더링됩니다 -->
            </div>
        </div>
    </main>


    <!-- Client-side filtering and sorting script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const marketFilter = document.getElementById('marketFilter');
            const marcapFilter = document.getElementById('marcapFilter');
            const dateInput = document.querySelector('input[type="date"][name="date"]');
            
            // Check if backend provided a date via query param, otherwise use local today
            const urlDate = "{{ date if date else '' }}";
            
            if (urlDate) {
                dateInput.value = urlDate;
            } else if (dateInput && !dateInput.value) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                dateInput.value = `${year}-${month}-${day}`;
            }
            
            // Sync URL when date is changed
            if (dateInput) {
                dateInput.addEventListener('change', (e) => {
                    if (e.target.value) {
                        const newUrl = new URL(window.location);
                        newUrl.searchParams.set('date', e.target.value);
                        window.history.pushState({}, '', newUrl);
                    }
                });
            }
            
            let currentSortCol = 'rs_rank';
            let currentSortOrder = 'asc';

            let allRows = [];
            let filteredRows = [];
            let currentPage = 1;
            const PAGE_SIZE = 50;
            let observer = null;

            function applyFiltersAndSort() {
                const search = searchInput.value.toLowerCase();
                const market = marketFilter.value;
                const minMarcap = marcapFilter.value ? parseInt(marcapFilter.value) * 100000000 : 0;

                // Filtering
                filteredRows = allRows.filter(row => {
                    const rowName = row.dataset.name || "";
                    const rowCode = row.dataset.code || "";
                    const rowMarket = row.dataset.market || "";
                    const rowMarcap = parseFloat(row.dataset.marcap) || 0;

                    const matchSearch = rowName.includes(search) || rowCode.includes(search);
                    // startsWith allows "KOSDAQ GLOBAL" to match when "KOSDAQ" is selected
                    const matchMarket = market === "" || rowMarket.startsWith(market);
                    const matchMarcap = minMarcap === 0 || rowMarcap >= minMarcap;

                    return matchSearch && matchMarket && matchMarcap;
                });

                // Sorting
                filteredRows.sort((a, b) => {
                    let valA = a.dataset[currentSortCol];
                    let valB = b.dataset[currentSortCol];

                    // Convert to numbers if possible
                    if (!isNaN(parseFloat(valA)) && isFinite(valA)) {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    }

                    if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                // Reset pagination and render
                currentPage = 1;
                renderPage();
                updateSortIcons();
                
                // Update stock count display
                const stockCountEl = document.getElementById('stockCount');
                if (stockCountEl) {
                    stockCountEl.textContent = filteredRows.length;
                }
            }

            function renderPage() {
                const tbody = document.getElementById('rs-table-body');
                if (!tbody) return;
                
                tbody.innerHTML = '';
                
                const fragment = document.createDocumentFragment();
                const rowsToRender = filteredRows.slice(0, currentPage * PAGE_SIZE);
                
                rowsToRender.forEach(row => fragment.appendChild(row));
                tbody.appendChild(fragment);

                setupObserver(tbody);
            }

            function loadMore() {
                if (currentPage * PAGE_SIZE >= filteredRows.length) return;
                
                const tbody = document.getElementById('rs-table-body');
                if (!tbody) return;

                const fragment = document.createDocumentFragment();
                const startIndex = currentPage * PAGE_SIZE;
                currentPage++;
                const endIndex = currentPage * PAGE_SIZE;
                
                const rowsToRender = filteredRows.slice(startIndex, endIndex);
                rowsToRender.forEach(row => fragment.appendChild(row));
                
                tbody.appendChild(fragment);
                setupObserver(tbody);
            }

            function setupObserver(tbody) {
                if (observer) observer.disconnect();
                
                const lastRow = tbody.lastElementChild;
                if (lastRow && (currentPage * PAGE_SIZE) < filteredRows.length) {
                    if (!observer) {
                        observer = new IntersectionObserver((entries) => {
                            if (entries[0].isIntersecting) {
                                loadMore();
                            }
                        }, { rootMargin: "200px" });
                    }
                    observer.observe(lastRow);
                }
            }
            
            function updateSortIcons() {
                document.querySelectorAll('th[data-sort]').forEach(th => {
                    const icon = th.querySelector('.sort-icon');
                    if(icon) icon.innerHTML = '';
                    th.classList.remove('text-primary');
                    if (th.dataset.sort === currentSortCol) {
                        th.classList.add('text-primary');
                        if(icon) {
                            icon.innerHTML = currentSortOrder === 'asc' ? '▲' : '▼';
                        }
                    }
                });
            }

            // Event Listeners for Filters
            searchInput.addEventListener('input', applyFiltersAndSort);
            marketFilter.addEventListener('change', applyFiltersAndSort);
            marcapFilter.addEventListener('change', applyFiltersAndSort);

            // HTMX Load event (when table is rendered)
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if(evt.detail.target.id === 'rs-table-container') {
                    
                    const template = document.getElementById('all-rows-template');
                    if (template) {
                        allRows = Array.from(template.content.querySelectorAll('tr.stock-row'));
                    }

                    // Attach click events to new headers
                    document.querySelectorAll('th[data-sort]').forEach(th => {
                        th.addEventListener('click', () => {
                            const col = th.dataset.sort;
                            if (currentSortCol === col) {
                                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
                            } else {
                                currentSortCol = col;
                                currentSortOrder = 'desc'; // Default to desc for new columns
                            }
                            applyFiltersAndSort();
                        });
                    });
                    
                    // Reset sort to default if new data loaded
                    currentSortCol = 'rs_rank';
                    currentSortOrder = 'asc';
                    applyFiltersAndSort();
                }
            });
        });
    </script>
{% endblock %}
