{% extends "base.html" %}

{% block title %}시장 상황 - stockspace{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">


    <!-- HTMX Target Container -->
    <div hx-get="/api/market-status" hx-trigger="load" hx-indicator="#market-loading">
        <!-- Spinner -->
        <div id="market-loading" class="htmx-indicator flex flex-col items-center justify-center py-20">
            <svg class="animate-spin h-10 w-10 text-cyan-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-theme-muted text-sm animate-pulse">최근 100일간의 시장 데이터를 분석 중입니다...</p>
        </div>
    </div>
</div>
{% endblock %}
